<section
  [(expanded)]="expanded"
  aria-labelledby="application-heading"
  class="pb-0"
  hlmCard
  hlmCollapsible
>
  <div hlmCardHeader>
    <h2 hlmCardTitle id="application-heading">
      <button
        class="group/trigger flex w-full cursor-pointer items-center gap-2 text-left"
        hlmCollapsibleTrigger
      >
        <ng-icon class="mb-0.5" name="lucideLayers" />
        Application
        <ng-icon
          class="ml-auto transition-transform duration-300 group-data-[state=open]/trigger:rotate-180"
          name="lucideChevronDown"
        />
      </button>
    </h2>
    <p hlmCardDescription>Practice on its own, or add a stage to an existing application.</p>
  </div>

  <div hlmCollapsibleContent>
    <div class="mb-5" hlmCardContent>
      <fieldset hlmFieldSet>
        <legend class="sr-only" hlmFieldLegend variant="label">Application</legend>
        <hlm-radio-group
          (valueChange)="onModeChange($event)"
          [formField]="interviewForm().applicationMode"
          class="gap-2"
        >
          <div hlmField orientation="horizontal">
            <hlm-radio inputId="application-standalone" value="standalone">
              <hlm-radio-indicator indicator />
            </hlm-radio>
            <label class="font-normal" for="application-standalone" hlmFieldLabel>
              Standalone interview
            </label>
          </div>

          <div class="flex-wrap gap-y-0 md:flex-nowrap" hlmField orientation="horizontal">
            <hlm-radio
              [disabled]="existingUnavailable()"
              inputId="application-existing"
              value="existing"
            >
              <hlm-radio-indicator indicator />
            </hlm-radio>
            <label class="font-normal md:flex-none!" for="application-existing" hlmFieldLabel>
              Next stage of an existing application
              @if (existingHint(); as hint) {
                <span class="text-muted-foreground">({{ hint }})</span>
              }
            </label>
            <!-- Collapses sideways when the row is horizontal (md+), downwards when it is stacked. -->
            <div [expanded]="existing()" class="min-w-0 basis-full md:basis-auto" hlmCollapsible>
              <div
                class="md:transition-[width,opacity] md:data-[state=closed]:h-auto md:data-[state=closed]:w-0 md:data-[state=open]:h-auto md:data-[state=open]:w-(--brn-collapsible-content-width)"
                hlmCollapsibleContent
              >
                <div class="pt-2 md:pt-0">
                  <hlm-select
                    (valueChange)="onApplicationChange($event)"
                    [disabled]="selectDisabled()"
                    [itemToString]="applicationName"
                    [value]="interviewForm().applicationId().value()"
                    class="ml-2"
                  >
                    <hlm-select-trigger class="w-full data-[size=default]:h-7 sm:w-80">
                      <hlm-select-value [placeholder]="placeholder()" />
                    </hlm-select-trigger>
                    <hlm-select-content *hlmSelectPortal>
                      @for (application of applications.value() ?? []; track application.id) {
                        <hlm-select-item [value]="application.id">
                          {{ applicationLabel(application) }}
                        </hlm-select-item>
                      }
                    </hlm-select-content>
                  </hlm-select>
                  <hlm-field-error
                    [errors]="interviewForm().applicationId().errors()"
                    [visible]="interviewForm().applicationId().touched()"
                  />
                </div>
              </div>
            </div>
          </div>

          <div hlmField orientation="horizontal">
            <hlm-radio inputId="application-new" value="new">
              <hlm-radio-indicator indicator />
            </hlm-radio>
            <label class="font-normal" for="application-new" hlmFieldLabel>
              Start a new application
            </label>
          </div>
        </hlm-radio-group>
      </fieldset>
    </div>
  </div>
</section>
