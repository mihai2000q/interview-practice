<app-topbar />
<!-- One outlet, always: moving it when the sidebar comes and goes would build the page twice. -->
<!-- While the sidebar's edge is dragged, its width must follow the pointer without the easing. -->
<hlm-sidebar-wrapper
  [attr.data-dragging]="sidebarWidth.dragging() ? '' : null"
  [sidebarWidth]="sidebarWidth.css()"
  class="min-h-[calc(100svh-57px)] [&[data-dragging]_[data-slot=sidebar-container]]:transition-none [&[data-dragging]_[data-slot=sidebar-gap]]:transition-none"
>
  @if (route.hasHistory()) {
    @defer {
      <app-history-sidebar />
    } @placeholder {
      <div aria-hidden="true" class="hidden w-(--sidebar-width) shrink-0 border-r md:block"></div>
    }
  }
  <div class="min-w-0 flex-1">
    <router-outlet />
  </div>
</hlm-sidebar-wrapper>
<hlm-toaster />
