<hlm-alert-dialog (stateChanged)="onOpenChange()">
  <button class="w-full" hlmAlertDialogTrigger hlmBtn variant="destructive">
    Abandon interview
  </button>
  <hlm-alert-dialog-content *hlmAlertDialogPortal="let ctx">
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle>Abandon this interview?</h2>
      <p hlmAlertDialogDescription>
        The interview ends now and can't be resumed. The answers you have given so far are kept.
      </p>
    </hlm-alert-dialog-header>
    @if (error(); as message) {
      <p class="text-sm text-destructive" role="alert">{{ message }}</p>
    }
    <hlm-alert-dialog-footer>
      <button [disabled]="busy()" hlmAlertDialogCancel>Keep going</button>
      <button
        (click)="confirm(ctx.close)"
        [loading]="busy()"
        hlmAlertDialogAction
        variant="destructive"
      >
        Abandon
      </button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>
