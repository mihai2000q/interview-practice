<main class="mx-auto flex max-w-3xl flex-col gap-6 px-6 py-10">
  <header class="flex flex-col gap-1">
    <h1 class="text-2xl font-semibold tracking-tight">New interview</h1>
    <p class="text-muted-foreground">Set up an interview for the role you are preparing for.</p>
  </header>

  @if (preferences.ready()) {
    <form (submit)="onSubmit($event)" class="flex flex-col gap-6" novalidate>
      <app-interview-application
        [(selectedApplication)]="selectedApplication"
        [interviewForm]="interviewForm"
      />

      <app-interview-job-context [interviewForm]="interviewForm" />
      <app-interview-documents
        [application]="selectedApplication()"
        [interviewForm]="interviewForm"
      />
      <app-interview-structure [interviewForm]="interviewForm" />
      <app-interview-persona [interviewForm]="interviewForm" />
      <app-phase-model-overrides [interviewForm]="interviewForm" />

      @if (submitError(); as message) {
        <p class="text-sm text-destructive" role="alert">{{ message }}</p>
      }

      <div class="flex justify-end gap-2">
        <a hlmBtn routerLink="/" variant="outline">Cancel</a>
        <span
          [hlmTooltip]="validationSummary()"
          [tooltipDisabled]="!interviewForm().invalid()"
          class="inline-flex"
          position="top"
        >
          <button
            [disabled]="submitDisabled()"
            [loading]="interviewForm().submitting()"
            hlmBtn
            type="submit"
          >
            Start interview
          </button>
        </span>
      </div>
    </form>
  } @else if (preferences.loadError(); as message) {
    <!-- The form shows and sends the Preferences defaults, so it waits for them. -->
    <div hlmEmpty>
      <div hlmEmptyHeader>
        <h2 hlmEmptyTitle>Could not load your defaults</h2>
        <p hlmEmptyDescription>{{ message }}</p>
      </div>
      <div hlmEmptyContent>
        <button (click)="preferences.reload()" hlmBtn type="button">Try again</button>
      </div>
    </div>
  } @else {
    <div aria-busy="true" class="flex flex-col gap-6" role="status">
      <span class="sr-only">Loading your defaults…</span>
      <div aria-hidden="true" class="h-40" hlmSkeleton></div>
      <div aria-hidden="true" class="h-64" hlmSkeleton></div>
      <div aria-hidden="true" class="h-48" hlmSkeleton></div>
      <div aria-hidden="true" class="h-40" hlmSkeleton></div>
      <div aria-hidden="true" class="h-32" hlmSkeleton></div>
      <div aria-hidden="true" class="h-14" hlmSkeleton></div>
      <div aria-hidden="true" class="ml-auto h-9 w-40" hlmSkeleton></div>
    </div>
  }
</main>
