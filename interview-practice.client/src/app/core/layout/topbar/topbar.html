<header
  class="border-b border-border bg-background/80 backdrop-blur supports-backdrop-filter:bg-background/70"
>
  <div class="flex h-14 items-center gap-3 px-4 sm:px-6">
    @if (route.hasHistory()) {
      <!-- The trigger draws its own icon and label, which the linter cannot see. -->
      <!-- eslint-disable-next-line @angular-eslint/template/elements-content -->
      <button
        class="-ml-2"
        hlmSidebarTrigger
        srOnlyText="Show or hide your interview history"
      ></button>
    }
    <nav aria-label="Breadcrumb" class="min-w-0" hlmBreadcrumb>
      <ol class="flex-nowrap gap-2 sm:gap-2.5" hlmBreadcrumbList>
        <li hlmBreadcrumbItem>
          <a
            aria-label="Interview Practice, home"
            class="flex items-center gap-2.5 rounded-md text-foreground outline-none focus-visible:ring-3 focus-visible:ring-ring/50"
            hlmBreadcrumbLink
            link="/"
          >
            <span
              aria-hidden="true"
              class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-primary text-primary-foreground shadow-xs"
            >
              <ng-icon name="lucideMessagesSquare" size="18" />
            </span>
            <span class="text-base font-semibold tracking-tight max-sm:sr-only">
              Interview Practice
            </span>
          </a>
        </li>
        @for (crumb of route.crumbs(); track crumb.label; let last = $last) {
          <li hlmBreadcrumbSeparator></li>
          <li class="min-w-0" hlmBreadcrumbItem>
            @if (crumb.link) {
              <a [link]="crumb.link" hlmBreadcrumbLink>{{ crumb.label }}</a>
            } @else {
              <span class="truncate" hlmBreadcrumbPage>{{ crumb.label }}</span>
            }
          </li>
        }
      </ol>
    </nav>

    <div class="ml-auto flex shrink-0 items-center gap-1">
      <button
        (click)="theme.toggle()"
        [attr.aria-label]="
          theme.isDark() ? 'Switch to the light theme' : 'Switch to the dark theme'
        "
        class="text-muted-foreground hover:text-foreground"
        hlmBtn
        size="icon"
        type="button"
        variant="ghost"
      >
        <ng-icon [name]="theme.isDark() ? 'lucideSun' : 'lucideMoon'" />
      </button>
    </div>
  </div>
</header>
