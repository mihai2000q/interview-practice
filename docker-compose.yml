# See docs/deployment.md for the reasoning behind every decision here.

name: interview-practice

services:
  client:
    build:
      context: ./interview-practice.client
    ports:
      - "${CLIENT_PORT:-8002}:${CLIENT_PORT:-8002}"
    environment:
      CLIENT_PORT: ${CLIENT_PORT:-8002}
      SERVER_PORT: ${SERVER_PORT:-8001}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    depends_on:
      - server

  server:
    build:
      context: ./interview-practice.server
    env_file:
      - ./interview-practice.server/.env
    environment:
      # Overrides .env's POSTGRES_HOST=localhost for container-to-container networking
      POSTGRES_HOST: db
      SERVER_PORT: ${SERVER_PORT:-8001}
      CLIENT_PORT: ${CLIENT_PORT:-8002}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      # The key itself is a Compose secret, mounted as a file; the app reads this path
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    secrets:
      - openrouter_api_key
    ports:
      - "${SERVER_PORT:-8001}:${SERVER_PORT:-8001}"
    volumes:
      - uploads:/app/instance/uploads
    depends_on:
      # The server runs `flask db upgrade` on start, so the database must be accepting connections
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      # Loopback only: lets host-run Flask/Alembic commands reach the DB
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    env_file:
      - ./interview-practice.server/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - db-data:/var/lib/postgresql/data

secrets:
  openrouter_api_key:
    # Read from the host shell's OPENROUTER_API_KEY, never from a file in this repo
    environment: OPENROUTER_API_KEY

volumes:
  db-data:
  uploads:
